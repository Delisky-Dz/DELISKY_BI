    class="dashboard-section"
    aria-labelledby="workers-summary-title"
>

        تغطية البائعين

    <div class="metric-grid">
        <article class="metric-card">
            <h3>البائعون المشمولون في التحليل</h3>

        <article class="metric-card">
            <h3>البائعون ذوو قياس مبيعات</h3>
            <p>

    </div>
</section>
