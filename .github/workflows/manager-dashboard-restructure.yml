name: Manager dashboard restructure

on:
  push:
    branches:
      - feature/manager-dashboard-restructure
  pull_request:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "apps/analytics/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/manager-dashboard-restructure.yml"

permissions:
  contents: write

jobs:
  dashboard-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delisky_bi_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delisky_bi_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-manager-dashboard-only
      DJANGO_DEBUG: "True"
      DB_NAME: delisky_bi_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_TEST_NAME: test_delisky_bi_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate legacy dashboard tests
        if: github.event_name == 'push' && hashFiles('scripts/migrate_manager_dashboard_tests.py') != ''
        run: |
          python scripts/migrate_manager_dashboard_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard scripts/migrate_manager_dashboard_tests.py
          if ! git diff --cached --quiet; then
            git commit -m "test: migrate dashboard tests to modular manager UI"
            git push origin HEAD:feature/manager-dashboard-restructure
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --settings=config.settings.development

      - name: Focused manager dashboard tests
        run: python manage.py test apps.dashboard.test_manager_dashboard_restructure --settings=config.settings.development -v 2

      - name: Full dashboard app tests
        run: python manage.py test apps.dashboard --settings=config.settings.development -v 2
