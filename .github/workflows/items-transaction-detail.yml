name: Items transaction detail

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/manager-dashboard-restructure
    paths:
      - "apps/imports/**"
      - "apps/analytics/**"
      - "apps/fleet/**"
      - "apps/workforce/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/items-transaction-detail.yml"

permissions:
  contents: read

jobs:
  items-detail-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delisky_bi_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delisky_bi_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-items-transaction-detail
      DJANGO_DEBUG: "True"
      DB_NAME: delisky_bi_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_TEST_NAME: test_delisky_bi_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --settings=config.settings.development

      - name: Validate backup PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/backup_delisky.ps1",
            "scripts/install_backup_task.ps1",
            "scripts/install_waitress_task.ps1",
            "scripts/start_production_waitress.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$file :: $($_.Message)"
              }
              exit 1
            }
          }

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.development

      - name: Compile safety helper scripts
        run: >-
          python -m py_compile
          scripts/backup_database.py
          scripts/verify_backup_restore.py
          scripts/verify_static_manifest.py
          scripts/smoke_manager_page.py

      - name: Build production static manifest
        env:
          DB_NAME: delisky_bi
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: app.delisky-dz.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.delisky-dz.com
        run: >-
          python manage.py collectstatic
          --noinput
          --settings=config.settings.production

      - name: Verify production static manifest
        env:
          DB_NAME: delisky_bi
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: app.delisky-dz.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.delisky-dz.com
        run: python scripts/verify_static_manifest.py

      - name: Focused Items detail tests
        run: >
          python manage.py test
          apps.imports.test_approval_dispatch
          apps.imports.test_raw_items_detail_approval
          apps.imports.test_raw_items_detail_batch_detail
          apps.imports.test_raw_items_detail_brand_partition
          apps.imports.test_raw_items_detail_cleaning
          apps.imports.test_raw_items_detail_derived_review
          apps.imports.test_raw_items_detail_file
          apps.imports.test_raw_items_detail_import_review
          apps.imports.test_raw_items_detail_multi_brand_review
          apps.imports.test_raw_items_detail_multi_review
          apps.imports.test_raw_items_detail_replacement
          apps.imports.test_raw_items_detail_review
          apps.imports.test_raw_items_detail_views
          apps.imports.test_items_detail_reference_provisioning
          apps.imports.test_phase10_provisioning
          apps.imports.test_production_settings_safety
          apps.imports.test_backup_database_safety
          apps.imports.test_backup_restore_verifier
          --settings=config.settings.development
          -v 2

      - name: Full project test suite
        run: python manage.py test --settings=config.settings.development -v 1
